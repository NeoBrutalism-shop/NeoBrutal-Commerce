name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Stage public Commerce surfaces
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          cp index.html components.html component-explorer.css component-explorer.js _site/
          cp -R account cart checkout components demo order pricing product products src storefront _site/
          touch _site/.nojekyll

          required=(
            index.html
            products/index.html
            product/soft/index.html
            pricing/index.html
            cart/index.html
            checkout/index.html
            order/success/index.html
            account/index.html
            account/license/demo-soft-team/index.html
            components/index.html
            components.html
            demo/v10.html
            demo/v10.css
            demo/v10.js
            src/index.css
            storefront/store.css
            storefront/store.js
            storefront/routes.json
            storefront/components.json
          )

          for file in "${required[@]}"; do
            test -f "_site/$file" || {
              echo "Missing required Pages asset: $file" >&2
              exit 1
            }
          done

          test ! -e _site/tests
          test ! -e _site/scripts
          if find _site -type l -print -quit | grep -q .; then
            echo "Pages artifact must not contain symbolic links" >&2
            exit 1
          fi

          echo "Validated ${#required[@]} required live surfaces/assets."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          include-hidden-files: true

  deploy:
    name: Deploy Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
