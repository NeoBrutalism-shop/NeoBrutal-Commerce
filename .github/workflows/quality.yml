name: Commerce quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conformance + contract tests
        run: npm run check
      - name: JavaScript syntax
        run: |
          node --check demo/demo.js
          node --check demo/v02.js
          node --check storefront/store.js
          node --check src/contracts/runtime.js
          node --check src/actions/runtime.js
          node --check src/actions/bindings.js
          node --check src/adapters/reference.js
          node --check src/adapters/edd.js
          node --check src/renderers/headless.js
          node --check src/renderers/react.js
          node --check src/renderers/action-controls.js
          node --check src/renderers/react-actions.js
          node --check tests/contracts-v05.test.mjs
          node --check tests/reference-adapter-v05.test.mjs
          node --check tests/renderers-v05.test.mjs
          node --check tests/actions-v05.test.mjs
          node --check tests/action-bindings-v05.test.mjs
          node --check tests/edd-adapter-v05.test.mjs
      - name: Serve static production routes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/commerce-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          curl --fail --silent http://127.0.0.1:4173/demo/ >/dev/null
          curl --fail --silent http://127.0.0.1:4173/demo/v02.html >/dev/null
          curl --fail --silent http://127.0.0.1:4173/product/soft/ >/dev/null
          curl --fail --silent 'http://127.0.0.1:4173/checkout/?state=failed' >/dev/null
          curl --fail --silent http://127.0.0.1:4173/account/license/demo-soft-team/ >/dev/null
          curl --fail --silent http://127.0.0.1:4173/components/ >/dev/null
          curl --fail --silent http://127.0.0.1:4173/src/index.css >/dev/null
          curl --fail --silent http://127.0.0.1:4173/src/contracts/runtime.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/src/contracts/index.d.ts >/dev/null
          curl --fail --silent http://127.0.0.1:4173/src/actions/runtime.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/src/actions/index.d.ts >/dev/null
          curl --fail --silent http://127.0.0.1:4173/src/actions/bindings.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/src/actions/bindings.d.ts >/dev/null
          curl --fail --silent http://127.0.0.1:4173/src/adapters/reference.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/src/adapters/reference.d.ts >/dev/null
          curl --fail --silent http://127.0.0.1:4173/src/adapters/edd.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/src/adapters/edd.d.ts >/dev/null
          curl --fail --silent http://127.0.0.1:4173/src/renderers/headless.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/src/renderers/headless.d.ts >/dev/null
          curl --fail --silent http://127.0.0.1:4173/src/renderers/react.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/src/renderers/react.d.ts >/dev/null
          curl --fail --silent http://127.0.0.1:4173/src/renderers/action-controls.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/src/renderers/action-controls.d.ts >/dev/null
          curl --fail --silent http://127.0.0.1:4173/src/renderers/react-actions.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/src/renderers/react-actions.d.ts >/dev/null
          curl --fail --silent http://127.0.0.1:4173/storefront/store.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/storefront/states.json >/dev/null
