name: Commerce quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conformance
        run: npm run check
      - name: JavaScript syntax
        run: |
          node --check demo/demo.js
          node --check demo/v02.js
          node --check storefront/store.js
      - name: Serve static production routes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/commerce-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          curl --fail --silent http://127.0.0.1:4173/demo/ >/dev/null
          curl --fail --silent http://127.0.0.1:4173/demo/v02.html >/dev/null
          curl --fail --silent http://127.0.0.1:4173/product/soft/ >/dev/null
          curl --fail --silent 'http://127.0.0.1:4173/checkout/?state=failed' >/dev/null
          curl --fail --silent http://127.0.0.1:4173/account/license/demo-soft-team/ >/dev/null
          curl --fail --silent http://127.0.0.1:4173/components/ >/dev/null
          curl --fail --silent http://127.0.0.1:4173/src/index.css >/dev/null
          curl --fail --silent http://127.0.0.1:4173/storefront/store.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/storefront/states.json >/dev/null
